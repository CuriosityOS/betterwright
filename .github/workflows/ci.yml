name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede a pull request's own earlier runs; never cancel a push to main.
# Pull requests group by number, so every push to the same PR shares one group
# and the newest run wins. Everything else groups by commit SHA, which gives
# each main push a group of exactly one — nothing can ever land in it to cancel
# it — and `cancel-in-progress` is additionally gated on the event so a
# workflow_dispatch or a tag build cannot be interrupted either.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Bun version policy. The two branch-protected jobs below and publish-npm.yml
# pin the same exact Bun 1.4.x patch (see .bun-version). The pin is the
# package's engines floor. Cross-platform unit tests run that same pin on
# Linux, macOS, and Windows.

jobs:
  package-integrity:
    # Keep this display name stable because main branch protection requires it.
    name: Worker copies in sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:versions
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:build
      # Coverage is report-only: it prints the table in the job log without
      # gating, so an experimental runner feature can never fail the release.
      - run: bun run test:unit
        env:
          BETTERWRIGHT_COVERAGE: "1"
      - run: bun run test:types
      - run: bun run check:package

  node:
    # Keep this display name stable because main branch protection requires it.
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      # BetterChromium is the only bundled browser backend.
      - name: Read the managed browser release and checksum
        id: browser_pins
        shell: bash
        run: |
          bun -e 'import { CHROMIUM_FORK_RELEASE_TAG, CHROMIUM_FORK_ASSETS } from "./dist/src/chromium-fork.js"; console.log(`release=${CHROMIUM_FORK_RELEASE_TAG}\nsha256=${CHROMIUM_FORK_ASSETS["linux-x64"].sha256}`)' >> "$GITHUB_OUTPUT"
      - name: Cache the managed browser download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.betterwright/chromium
          # Revisions of the same Chromium version carry different native
          # patches. Never reuse a cache from an older release or asset.
          key: managed-browsers-${{ runner.os }}-${{ steps.browser_pins.outputs.release }}-${{ steps.browser_pins.outputs.sha256 }}
      - name: Install managed browser
        run: bun dist/bin/betterwright.js setup
      - name: Enable Chromium sandbox user namespaces
        shell: bash
        run: |
          # BetterChromium keeps Chromium's sandbox enabled; its Linux sandbox
          # needs unprivileged user namespaces on AppArmor-restricted runners.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install recording encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # REQUIRE_BROWSER turns the suite's local-dev skip into a CI failure, so a
      # broken BetterChromium install cannot report green by skipping tests.
      - run: bun run test
        env:
          BETTERWRIGHT_REQUIRE_BROWSER: "1"
          BETTERWRIGHT_REQUIRE_RECORDING: "1"

  cross-platform:
    # A NEW job, deliberately not a matrix over the two jobs above. Branch
    # protection on main requires the literal check names "Worker copies in
    # sync" and "Node tests"; GitHub appends matrix values to a job's display
    # name, so turning either of those into a matrix would make the required
    # checks unmatchable and block every merge.
    # Platform coverage therefore lives here. Branch protection still requires
    # the old Node-matrix display names ("… (ubuntu-latest, 22)" and 24).
    # `legacy` is only that suffix — every cell runs Bun 1.4.
    name: Cross-platform unit tests (${{ matrix.os }}, ${{ matrix.legacy }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        legacy: [22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test:unit

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      # Report-only. Runtime dependencies are exact-pinned and Dependabot is
      # configured to leave them alone (.github/dependabot.yml): playwright-core
      # couples to a specific browser build, and tldts carries the Public Suffix
      # List snapshot that decides credential base-domain scope. An advisory
      # against one of those cannot be applied by bumping a caret. continue-on-error
      # keeps a finding loud without letting a third-party publish take the
      # repository offline.
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: bun audit --audit-level=high
      - name: Summarise
        run: |
          {
            echo "### Dependency audit (advisory — never gates a merge)"
            echo
            echo "| Scope | \`--audit-level=high\` |"
            echo "| --- | --- |"
            echo "| All dependencies | ${{ steps.audit.outcome == 'success' && 'clean' || '**findings — see the step log**' }} |"
            echo
            echo "A runtime finding needs a deliberate pin bump across package.json,"
            echo "\`src/doctor.ts\`, and publish-npm.yml — see \`bun run check:versions\`."
          } >> "$GITHUB_STEP_SUMMARY"
